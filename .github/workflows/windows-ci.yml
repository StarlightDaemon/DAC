name: Windows CI

on:
  pull_request:
  push:
    branches: [main, feature/standalone-publication]

permissions:
  contents: read

concurrency:
  group: windows-ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: pwsh

jobs:
  windows-x64:
    name: Windows x64 validation
    runs-on: windows-2025
    timeout-minutes: 45
    steps:
      - name: Mask runner paths
        timeout-minutes: 1
        run: |
          foreach ($path in @($env:GITHUB_WORKSPACE, $env:RUNNER_TEMP, $env:USERPROFILE)) {
            if ($path) {
              Write-Output "::add-mask::$path"
              Write-Output ('::add-mask::' + $path.Replace('\', '/'))
            }
          }
      - name: Checkout event revision
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        timeout-minutes: 5
        with:
          fetch-depth: 0
          persist-credentials: false
          show-progress: false
      - name: Verify pinned build inputs
        timeout-minutes: 20
        run: ./tools/ci-windows.ps1 -Phase Bootstrap
      - name: Build and test Release
        timeout-minutes: 10
        run: ./tools/ci-windows.ps1 -Phase Release
      - name: Build and test Debug
        timeout-minutes: 10
        run: ./tools/ci-windows.ps1 -Phase Debug
      - name: Analyze production source
        timeout-minutes: 10
        run: ./tools/ci-windows.ps1 -Phase Analyze
      - name: Verify reproducibility and package integrity
        timeout-minutes: 10
        run: ./tools/ci-windows.ps1 -Phase Package
      - name: Audit publication privacy
        timeout-minutes: 10
        run: ./tools/ci-windows.ps1 -Phase Audit
      - name: Verify development artifact receipt
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        timeout-minutes: 1
        run: |
          $ErrorActionPreference = 'Stop'
          trap { Write-Output 'Development artifact receipt verification failed.'; exit 1 }
          $archive = 'build/ci-package/DAC-0.1.0-dev-windows-x64.zip'
          $checksum = $archive + '.sha256'
          foreach ($file in @($archive, $checksum)) {
            if (-not (Test-Path -LiteralPath $file -PathType Leaf)) { throw 'Required artifact file missing.' }
          }
          $digest = (Get-FileHash -LiteralPath $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          $expected = $digest + '  DAC-0.1.0-dev-windows-x64.zip' + "`n"
          if ([IO.File]::ReadAllText((Resolve-Path -LiteralPath $checksum).Path) -cne $expected) {
            throw 'Artifact checksum receipt does not match the verified archive.'
          }
          Write-Output 'Development artifact archive and checksum receipt: passed.'
      - name: Upload development test package
        if: ${{ success() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        timeout-minutes: 5
        with:
          name: DAC-0.1.0-dev-windows-x64-${{ github.sha }}
          path: |
            build/ci-package/DAC-0.1.0-dev-windows-x64.zip
            build/ci-package/DAC-0.1.0-dev-windows-x64.zip.sha256
          if-no-files-found: error
          include-hidden-files: false
          retention-days: 14
          compression-level: 0
          overwrite: false
          archive: true
